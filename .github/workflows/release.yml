name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v1.0.0). Leave empty to auto-increment patch version.'
        required: false
        type: string
      bump:
        description: 'Version bump type (only used if tag is empty)'
        required: false
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1

      - name: Determine next version
        id: version
        run: |
          # If tag is provided, validate and use it
          if [ -n "${{ inputs.tag }}" ]; then
            RAW_TAG="${{ inputs.tag }}"
            # Accept either 1.2.3 or v1.2.3, normalize to v1.2.3
            if [[ "$RAW_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              TAG="v${RAW_TAG}"
            else
              TAG="$RAW_TAG"
            fi

            # Validate semver format: vMAJOR.MINOR.PATCH
            if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Error: Invalid tag format '$RAW_TAG'. Expected: vMAJOR.MINOR.PATCH (e.g., v1.2.3 or 1.2.3)." >&2
              exit 1
            fi
            echo "tag=${TAG}" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Get latest tag, default to v0.0.0 if none exists
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "Latest tag: ${LATEST_TAG}"

          # Remove 'v' prefix for version manipulation
          VERSION="${LATEST_TAG#v}"

          # Strip any pre-release or build metadata (e.g., "-beta.1", "+build.5")
          BASE_VERSION="${VERSION%%[-+]*}"

          # Split version into components
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE_VERSION"

          # Bump version based on input
          case "${{ inputs.bump }}" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch|*)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          echo "New tag: ${NEW_TAG}"
          echo "tag=${NEW_TAG}" >> $GITHUB_OUTPUT

      - name: Validate version
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")

          # Parse versions for comparison
          NEW_VERSION="${TAG#v}"
          LATEST_VERSION="${LATEST_TAG#v}"

          # Strip pre-release/build metadata
          NEW_BASE="${NEW_VERSION%%[-+]*}"
          LATEST_BASE="${LATEST_VERSION%%[-+]*}"

          # Compare versions
          IFS='.' read -r NEW_MAJOR NEW_MINOR NEW_PATCH <<< "$NEW_BASE"
          IFS='.' read -r LATEST_MAJOR LATEST_MINOR LATEST_PATCH <<< "$LATEST_BASE"

          if [ "$NEW_MAJOR" -lt "$LATEST_MAJOR" ] || \
             ([ "$NEW_MAJOR" -eq "$LATEST_MAJOR" ] && [ "$NEW_MINOR" -lt "$LATEST_MINOR" ]) || \
             ([ "$NEW_MAJOR" -eq "$LATEST_MAJOR" ] && [ "$NEW_MINOR" -eq "$LATEST_MINOR" ] && [ "$NEW_PATCH" -le "$LATEST_PATCH" ]); then
            echo "Error: New version ${TAG} must be greater than latest version ${LATEST_TAG}" >&2
            exit 1
          fi

          echo "✓ Version ${TAG} > ${LATEST_TAG}"

      - name: Create and push tag
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "${TAG}"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: 'v2.6.1'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
